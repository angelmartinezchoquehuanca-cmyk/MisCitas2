<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda Espectacular</title>
<style>
  :root { --bg: #F8FAFC; --surface: #FFFFFF; --ink: #0F172A; --muted: #64748B; --line: #E2E8F0; --accent: #2563EB; --ok: #10B981; }
  * { box-sizing: border-box; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); padding: 24px; display: flex; flex-direction: column; align-items: center; }
  main { width: 100%; max-width: 1100px; display: flex; flex-direction: column; gap: 20px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); }
  .flex { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  input { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 14px; flex: 1; min-width: 280px; }
  button { font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 8px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: 70px repeat(7, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .cell { padding: 12px 6px; text-align: center; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 13px; min-height: 55px; }
  .header { background: var(--bg); font-weight: 700; }
  .time-col { font-weight: 700; color: var(--muted); background: var(--bg); text-align: right; padding-right: 10px; }
  .event { margin: 2px; padding: 4px 6px; border-radius: 6px; font-size: 11px; font-weight: 600; text-align: left; }
  .event.busy { background: rgba(37, 99, 235, 0.1); border-left: 3px solid var(--accent); color: var(--ink); }
  .event.free { background: rgba(16, 185, 129, 0.1); border-left: 3px solid var(--ok); color: var(--ok); }
  #status { font-weight: 600; font-size: 14px; margin-top: 5px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1 style="font-size: 22px; margin-bottom: 12px;">🗓️ Agenda Espectacular Pro</h1>
    <div class="flex">
      <div style="flex: 1;">
        <label style="font-size: 12px; font-weight: 700; color: var(--muted);">ID DE CLIENTE GOOGLE OAUTH</label>
        <input id="clientIdInput" type="text" placeholder="Pega aquí el ID gris largo de Google que termina en .apps.googleusercontent.com">
      </div>
      <button id="connectBtn" class="primary">Conectar Google Calendar</button>
      <button id="clearBtn">Borrar Memoria</button>
    </div>
    <div id="status" style="color: var(--accent); margin-top: 10px;">Introduce tu ID de cliente para arrancar.</div>
  </div>

  <div class="card" style="overflow-x: auto;">
    <div class="grid" id="calendarGrid">
      <!-- La rejilla se genera dinámicamente -->
    </div>
  </div>
</main>

<script src="https://google.com"></script>
<script>
  const $ = id => document.getElementById(id);
  const START_H = 8, END_H = 20; 
  let days = [];

  function buildHeader() {
    const grid = $("calendarGrid");
    grid.innerHTML = '<div class="cell header">Hora</div>';
    days = [];
    const today = new Date();
    today.setHours(0,0,0,0);

    for (let i = 0; i < 7; i++) {
      const d = new Date(today);
      d.setDate(today.getDate() + i);
      days.push(d);
      
      const label = document.createElement("div");
      label.className = "cell header";
      label.innerHTML = `<div>${d.toLocaleDateString("es-ES", {weekday: 'short'})}</div><div style="color:var(--accent); font-size:15px;">${d.getDate()}</div>`;
      grid.appendChild(label);
    }
    
    for (let h = START_H; h <= END_H; h++) {
      const timeLabel = document.createElement("div");
      timeLabel.className = "cell time-col";
      timeLabel.textContent = `${h}:00`;
      grid.appendChild(timeLabel);

      for (let d = 0; d < 7; d++) {
        const slot = document.createElement("div");
        slot.className = "cell";
        slot.id = `cell-${d}-${h}`;
        grid.appendChild(slot);
      }
    }
  }

  if (localStorage.getItem("saved_cid")) {
    $("clientIdInput").value = localStorage.getItem("saved_cid");
    $("status").textContent = "ID cargado de la memoria. Pulsa 'Conectar Google Calendar'.";
    $("status").style.color = "var(--ok)";
  }

  $("connectBtn").onclick = () => {
    const cid = $("clientIdInput").value.trim();
    if (!cid) return alert("Por favor, introduce primero tu ID largo de Google.");
    localStorage.setItem("saved_cid", cid);

    const client = google.accounts.oauth2.initTokenClient({
      client_id: cid,
      scope: "https://googleapis.com",
      ux_mode: "popup",
      callback: (res) => {
        if (res.error) {
          $("status").textContent = "Error: " + res.error;
          $("status").style.color = "red";
          return;
        }
        $("status").textContent = "¡Conectado! Sincronizando citas...";
        $("status").style.color = "var(--ok)";
        fetchEvents(res.access_token);
      }
    });
    client.requestAccessToken({ prompt: "consent" });
  };

  async function fetchEvents(token) {
    const timeMin = days[0].toISOString();
    const timeMax = new Date(days[6].getTime() + 24*60*60*1000).toISOString();

    try {
      const res = await fetch(`https://googleapis.com{timeMin}&timeMax=${timeMax}&singleEvents=true`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      
      for (let h = START_H; h <= END_H; h++) {
        for (let d = 0; d < 7; d++) {
          const block = $(`cell-${d}-${h}`);
          if (block) block.innerHTML = '<div class="event free">Disponible</div>';
        }
      }

      if (data.items) {
        data.items.forEach(ev => {
          const start = new Date(ev.start.dateTime || ev.start.date);
          const dayIdx = days.findIndex(d => d.getDate() === start.getDate() && d.getMonth() === start.getMonth());
          
          if (dayIdx !== -1) {
            const hour = start.getHours();
            if (hour >= START_H && hour <= END_H) {
              const block = $(`cell-${dayIdx}-${hour}`);
              if (block) {
                block.innerHTML = `<div class="event busy" title="${ev.summary || 'Ocupado'}">${ev.summary || 'Cita Ocupada'}</div>`;
              }
            }
          }
        });
      }
      $("status").textContent = "Calendario sincronizado correctamente.";
    } catch (e) {
      $("status").textContent = "Error al descargar los eventos de Google.";
      $("status").style.color = "red";
    }
  }

  $("clearBtn").onclick = () => {
    localStorage.clear();
    location.reload();
  };

  buildHeader();
</script>
</body>
</html>
